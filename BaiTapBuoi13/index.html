<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strips Hover Effect</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="color.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <div class="strip strip--forestgreen">
            <p class="strip__title">Relax</p>
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&h=600&fit=crop"
                alt="forestgreen">
            <div class="overlay"></div>
        </div>
        <div class="strip strip--khaki">
            <p class="strip__title">Explore</p>
            <img src=" https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=800&h=600&fit=crop" alt="khaki">
            <div class="overlay"></div>
        </div>
        <div class="strip strip--dodgerblue">
            <p class="strip__title">Travel</p>
            <img src="https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?w=800&h=600&fit=crop"
                alt="dodgerblue">
            <div class="overlay"></div>
        </div>
        <div class="strip strip--orange">
            <p class="strip__title">Achieve</p>
            <img src="https://images.unsplash.com/photo-1484589065579-248aad0d8b13?w=800&h=600&fit=crop" alt="orange">
            <div class="overlay"></div>
        </div>
        <div class="strip strip--violet">
            <p class="strip__title">Dare</p>
            <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&h=600&fit=crop" alt="violet">
            <div class="overlay"></div>
        </div>
    </div>
</body>

</html>
