<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentsPage</title>
    <link rel="stylesheet" href="../css/base.css">
</head>

<body>
    <h1 id="main">STUDENTS PAGE</h1>
    <!-- 
    Phần tử này có: tag(h1) + id(#main)
    Selector thắng: #main
    Vì: độ ưu tiên của #main cao hơn h1
    Màu hiển thị: orange
    -->
    <h2 class="title">Danh sach hoc vien</h2>
    <!-- 
    Phần tử này có: tag(h2) + class(.title)
    Selector thắng: .title
    Vì: độ ưu tiên .title cao hơn h2
    Màu hiển thị: violet
    -->
    <h3 class="title">Nhóm 1:</h3>
    <!-- 
    Phần tử này có: tag(h3) + class(.title)
    Selector thắng: .title
    Vì: độ ưu tiên .title cao hơn h3
    Màu hiển thị: violet
    -->
    <p class="highlight">Nguyen Van A</p>
    <!-- 
    Phần tử này có: tag(p) + class(.highlight)
    Selector thắng: .highlight
    Vì: độ ưu tiên .highlight cao hơn p
    Màu hiển thị: rgb(243, 243, 44)
    -->
    <p class="big">Tran Van B</p>
    <!-- 
    Phần tử này có: tag(p) + class(.big)
    Selector thắng: .big
    Vì: độ ưu tiên .big cao hơn p
    Màu hiển thị: olive
    -->


    <h3 class="title">Nhóm 2:</h3>
    <!-- 
    Phần tử này có: tag(h3) + class(.title)
    Selector thắng: .title
    Vì: độ ưu tiên .title cao hơn h3
    Màu hiển thị: violet
    -->
    <p class="highlight">Le Van C</p>
    <!-- 
    Phần tử này có: tag(p) + class(.highlight)
    Selector thắng: .highlight
    Vì: độ ưu tiên .highlight cao hơn p
    Màu hiển thị: rgb(243, 243, 44)
    -->

    <p class="big">Pham Van D</p>
    <!-- 
    Phần tử này có: tag(p) + class(.big)
    Selector thắng: .big
    Vì: độ ưu tiên .big cao hơn p
    Màu hiển thị: olive
    -->
</body>

</html>
